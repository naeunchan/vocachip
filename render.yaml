databases:
  - name: vocachip-postgres
    databaseName: vocachip
    user: vocachip
    plan: free
    ipAllowList: []

services:
  - type: web
    name: vocachip-ai-api
    runtime: node
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: DICTIONARY_API_KEY
        sync: false
      - key: DICTIONARY_API_REFERENCE
        value: collegiate
      - key: AI_ALLOWED_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: vocachip-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: APP_USER_KEY_HASH_SECRET
        generateValue: true
      - key: APP_STATE_RATE_LIMIT_MAX
        value: 120
