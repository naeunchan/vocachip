services:
  - type: web
    name: vocachip-ai-api
    runtime: node
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: DICTIONARY_API_KEY
        sync: false
      - key: DICTIONARY_API_REFERENCE
        value: collegiate
      - key: AI_ALLOWED_ORIGIN
        sync: false
